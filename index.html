<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DT Growth Charter Renderer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f4f4f0;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #1a1a1a;
      color: #f4f4f0;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.1rem; font-weight: 500; letter-spacing: 0.02em; }
    header span { font-size: 0.8rem; opacity: 0.5; }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 1.5rem;
      border: 1px solid #e0dfd8;
    }

    .card h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 1rem;
    }

    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    select, textarea, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #ddd;
      outline: none;
    }

    select {
      padding: 0.55rem 0.75rem;
      background: #f9f9f7;
      flex: 1;
      min-width: 200px;
    }
    select:focus { border-color: #555; }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 0.75rem;
      resize: vertical;
      background: #f9f9f7;
      line-height: 1.6;
    }
    textarea:focus { border-color: #555; }

    button {
      padding: 0.55rem 1.25rem;
      cursor: pointer;
      font-weight: 500;
      border: none;
      background: #1a1a1a;
      color: #fff;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    button:hover { opacity: 0.8; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.secondary {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #ccc;
    }

    .status {
      font-size: 0.85rem;
      color: #666;
      padding: 0.4rem 0;
    }
    .status.error { color: #c0392b; }

    /* Charter output */
    #charter-output {
      display: none;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e0dfd8;
    }

    .charter-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #f0efe8;
    }
    .charter-toolbar h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
    }

    #charter-body {
      padding: 2rem 2.5rem;
      line-height: 1.75;
    }

    /* Markdown styles */
    #charter-body h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    #charter-body h2 { font-size: 1.2rem; margin: 0.1rem 0 0.1rem; color: #333; }
    #charter-body h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: #111; border-bottom: 1px solid #eee; padding-bottom: 0.3rem; }
    #charter-body p  { margin: 0.75rem 0; }
    #charter-body ul { padding-left: 1.25rem; margin: 0.5rem 0; }
    #charter-body li { margin: 0.3rem 0; }
    #charter-body strong { font-weight: 600; }
    #charter-body em { color: #555; }
    #charter-body hr { border: none; border-top: 1px solid #eee; margin: 1.5rem 0; }

    #charter-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.75rem 0;
      font-size: 0.93rem;
    }
    #charter-body td, #charter-body th {
      border: 1px solid #e8e8e2;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    #charter-body th { background: #f5f5f0; font-weight: 600; }
    #charter-body tr:nth-child(even) td { background: #fafaf8; }

    .tag {
      display: inline-block;
      background: #f0efe8;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #555;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>

<header>
  <h1>DT Growth Charter Renderer</h1>
  <span>CRM Node System</span>
</header>

<main>

  <!-- Setup -->
  <div class="card">
    <h2>Setup</h2>
    <div class="row">
      <button onclick="seedDB()">Seed sample data (Sureflow)</button>
      <span class="status" id="seed-status"></span>
    </div>
  </div>

  <!-- Part A: existing account -->
  <div class="card">
    <h2>Part A — Render charter from CRM data</h2>
    <div class="row">
      <select id="account-select">
        <option value="">Select a company…</option>
      </select>
      <button onclick="renderCharter()">Generate Charter</button>
    </div>
    <p class="status" id="charter-status"></p>
  </div>

  <!-- Part B: transcript extraction -->
  <div class="card">
    <h2>Part B — Extract nodes from transcript <span class="tag">Gemini</span></h2>
    <textarea id="transcript-input" placeholder="Paste a founder conversation transcript here…"></textarea>
    <div class="row" style="margin-top: 0.75rem">
      <button onclick="extractTranscript()">Extract & Generate Charter</button>
      <p class="status" id="extract-status"></p>
    </div>
  </div>

  <!-- Charter output -->
  <div id="charter-output">
    <div class="charter-toolbar">
      <h2 id="charter-company-label">Growth Charter</h2>
      <button class="secondary" onclick="copyCharter()">Copy markdown</button>
    </div>
    <div id="charter-body"></div>
  </div>

</main>

<script>
  let rawMarkdown = '';

  async function seedDB() {
    const btn = event.target;
    btn.disabled = true;
    setStatus('seed-status', 'Seeding…');
    try {
      const res  = await fetch('/api/seed', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      setStatus('seed-status', data.message);
      await loadAccounts();
    } catch (err) {
      setStatus('seed-status', err.message, true);
    } finally {
      btn.disabled = false;
    }
  }

  async function loadAccounts() {
    const sel = document.getElementById('account-select');
    const res  = await fetch('/api/accounts');
    const list = await res.json();
    sel.innerHTML = '<option value="">Select a company…</option>';
    list.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a._id;
      opt.textContent = a.companyName;
      sel.appendChild(opt);
    });
  }

  async function renderCharter() {
    const accountId = document.getElementById('account-select').value;
    if (!accountId) { setStatus('charter-status', 'Please select a company first.', true); return; }
    setStatus('charter-status', 'Generating…');
    try {
      const res  = await fetch(`/api/charter/${accountId}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      showCharter(data.charter, data.companyName);
      setStatus('charter-status', '');
    } catch (err) {
      setStatus('charter-status', err.message, true);
    }
  }

  async function extractTranscript() {
    const transcript = document.getElementById('transcript-input').value.trim();
    if (!transcript) { setStatus('extract-status', 'Please paste a transcript first.', true); return; }
    setStatus('extract-status', 'Sending to Gemini — this may take a few seconds…');
    try {
      const res  = await fetch('/api/extract', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transcript }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      showCharter(data.charter, data.companyName);
      await loadAccounts();
      setStatus('extract-status', `Extracted and saved "${data.companyName}"`);
    } catch (err) {
      setStatus('extract-status', err.message, true);
    }
  }

  function showCharter(markdown, companyName) {
    rawMarkdown = markdown;
    document.getElementById('charter-company-label').textContent =
      `Growth Charter — ${companyName}`;
    document.getElementById('charter-body').innerHTML = marked.parse(markdown);
    const output = document.getElementById('charter-output');
    output.style.display = 'block';
    output.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function copyCharter() {
    navigator.clipboard.writeText(rawMarkdown).then(() => alert('Markdown copied!'));
  }

  function setStatus(id, msg, isError = false) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status' + (isError ? ' error' : '');
  }

  // Load accounts on page load
  loadAccounts();
</script>
</body>
</html>
